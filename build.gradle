plugins {
    id 'java'
    // Use the Goooler Shadow fork for better Java 21+ support
    id 'io.github.goooler.shadow' version '8.1.7'
    id 'io.papermc.paperweight.userdev' version '1.7.1'
}

group = 'org.starkmc'
version = '1.0.0-ALPHA'
description = 'Advanced Alt & Impersonation detection for offline-mode nLogin servers.'

repositories {
    mavenCentral()
    maven { name = "papermc-repo"; url = "https://repo.papermc.io/repository/maven-public/" }
    maven { name = "sonatype"; url = "https://oss.sonatype.org/content/groups/public/" }
    maven { name = "aikar-repo"; url = "https://repo.aikar.co/content/groups/aikar/" }
}

dependencies {
    paperweight.paperDevBundle("1.21-R0.1-SNAPSHOT")

    // --- FIX: Change Adventure scope to implementation ---
    // Use versions known to be compatible with Paper 1.21
    // These versions are commonly bundled, but check Paper's specific build if needed
    implementation("net.kyori:adventure-api:4.17.0")
    implementation("net.kyori:adventure-text-minimessage:4.17.0")
    implementation("net.kyori:adventure-platform-bukkit:4.3.2") // This provides BukkitAudiences

    // Database dependencies
    implementation("org.xerial:sqlite-jdbc:3.45.3.0")
    implementation("com.zaxxer:HikariCP:5.1.0")
    compileOnly("org.slf4j:slf4j-api:1.7.36") // Keep compileOnly, provided by server

    // String Similarity
    implementation("org.apache.commons:commons-text:1.12.0")

    // Command Framework (ACF)
    implementation("co.aikar:acf-paper:0.5.1-SNAPSHOT") // Keep snapshot or try 0.5.1 stable

    // Caching Library
    implementation("com.github.ben-manes.caffeine:caffeine:3.1.8")

    // nLogin API Placeholder...
}

// Java configuration remains the same...
def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 9) {
        options.release = targetJavaVersion
    }
}

// processResources remains the same...
processResources {
    def props = [version: project.version] // Use project.version here for consistency
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// Shadow JAR configuration
// Configure shadowJar task to embed and relocate dependencies
shadowJar {
    archiveBaseName.set('AltGuardian')
    archiveClassifier.set('')
    archiveVersion.set(project.version.toString())

    // Relocate dependencies to prevent conflicts
    // relocate 'org.sqlite', 'org.starkmc.altguardian.libs.sqlite' // <<< REMOVE OR COMMENT OUT THIS LINE
    relocate 'com.zaxxer.hikari', 'org.starkmc.altguardian.libs.hikari'
    relocate 'org.apache.commons.text', 'org.starkmc.altguardian.libs.commonstext'
    relocate 'co.aikar.commands', 'org.starkmc.altguardian.libs.acf'
    relocate 'co.aikar.locales', 'org.starkmc.altguardian.libs.acf.locales'
    relocate 'com.github.benmanes.caffeine', 'org.starkmc.altguardian.libs.caffeine'

    // DO NOT relocate org.sqlite

    // Ensure dependencies marked 'implementation' are included
}

build { dependsOn shadowJar }