plugins {
    id 'java'
    // Shadow plugin for embedding dependencies
    id 'com.github.johnrengelman.shadow' version '8.1.1' // Or latest stable version
    // Paperweight for Paper API access and development environment
    id 'io.papermc.paperweight.userdev' version '1.7.1' // Or latest stable version
}

group = 'org.starkmc' // Your chosen group ID
version = '1.0.0-ALPHA' // Your plugin version
description = 'Advanced Alt & Impersonation detection for offline-mode nLogin servers.'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/" // Paper API, Adventure, etc.
    }
    maven {
        name = "sonatype" // Keep if needed for other dependencies, usually covered by Maven Central
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    // Add ACF (Aikar Command Framework) Repo
    maven {
        name = "aikar-repo"
        url = "https://repo.aikar.co/content/groups/aikar/"
    }
    // Optional: JitPack if nLogin API or other deps are hosted there
    // maven { url = "https://jitpack.io" }
}

dependencies {
    // Paper API (Provides Bukkit, Spigot, Paper APIs and NMS)
    // Use the version matching your target server (e.g., 1.21 or latest patch like 1.21.x)
    paperweight.paperDevBundle("1.21-R0.1-SNAPSHOT") // Adjust version as needed

    // Adventure API (Bundled with Paper, compileOnly is good practice)
    compileOnly("net.kyori:adventure-api:4.17.0") // Match Paper's version if known
    compileOnly("net.kyori:adventure-text-minimessage:4.17.0")
    compileOnly("net.kyori:adventure-platform-bukkit:4.3.2") // Use Paper's bundled version

    // Database
    implementation("org.xerial:sqlite-jdbc:3.45.3.0") // Or latest SQLite driver
    implementation("com.zaxxer:HikariCP:5.1.0")      // Or latest HikariCP pool
    // HikariCP requires slf4j-api, ensure it's available or added if needed (often provided by server)
    compileOnly("org.slf4j:slf4j-api:1.7.36") // Compile only, usually provided by Paper/env

    // String Similarity
    implementation("org.apache.commons:commons-text:1.12.0") // For LevenshteinDistance

    // Command Framework (ACF) for Paper
    implementation("co.aikar:acf-paper:0.5.1-SNAPSHOT") // Use latest ACF version

    // Caching Library (Caffeine recommended)
    implementation("com.github.ben-manes.caffeine:caffeine:3.1.8") // Or latest Caffeine

    // nLogin API (Crucial - Need to find the correct dependency)
    // --- Placeholder - Replace with actual nLogin API dependency ---
    // Option A: If it's on Maven Central/JitPack/Custom Repo
    // compileOnly("com.nickuc.login:nlogin-api:VERSION") // Example structure
    // Option B: If you have the API JAR file locally
    // compileOnly(files("libs/nLogin-API.jar")) // Put the JAR in a 'libs' folder
    // Option C: Rely only on Bukkit events (less ideal, implemented in listener)
    // --- End Placeholder ---

}

// Configure Java version (already set in your file)
def targetJavaVersion = 21 // Paper 1.21+ needs 17+, 21 is fine
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Good practice

    // Use release flag for modern Java versions
    if (targetJavaVersion >= 9) { // Check if target is 9+
        options.release = targetJavaVersion
    }
}

// Process plugin.yml, substituting the version (already present in your file)
processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}


// Configure shadowJar task to embed and relocate dependencies
shadowJar {
    // Set the base name for the output JAR (e.g., AltGuardian)
    archiveBaseName.set('AltGuardian') // Set your desired plugin JAR name here
    // Remove the classifier (like '-all')
    archiveClassifier.set('')
    // Include version in the final JAR name (e.g., AltGuardian-1.0.0-ALPHA.jar)
    archiveVersion.set(project.version.toString())

    // Relocate dependencies to avoid conflicts with other plugins
    // Use your unique package structure here (e.g., org.starkmc.altguardian.libs).
    relocate 'org.sqlite', 'org.starkmc.altguardian.libs.sqlite'
    relocate 'com.zaxxer.hikari', 'org.starkmc.altguardian.libs.hikari'
    // Relocate slf4j if you decide to embed it (usually not needed)
    // relocate 'org.slf4j', 'org.starkmc.altguardian.libs.slf4j'
    relocate 'org.apache.commons.text', 'org.starkmc.altguardian.libs.commonstext'
    relocate 'co.aikar.commands', 'org.starkmc.altguardian.libs.acf' // Relocate ACF
    relocate 'co.aikar.locales', 'org.starkmc.altguardian.libs.acf.locales' // Relocate ACF locales
    relocate 'com.github.benmanes.caffeine', 'org.starkmc.altguardian.libs.caffeine' // Relocate Caffeine

    // Ensure dependencies marked 'implementation' are included
    // shadow configuration automatically includes 'runtimeClasspath' which covers 'implementation'

    // Minimize JAR size (optional, can sometimes cause issues if reflection is used heavily)
    // minimize()
}

// Make the 'build' task depend on 'shadowJar' so the shadowed JAR is created
build {
    dependsOn shadowJar
}

// Optional: If you want 'assemble' task to also trigger shadowJar
// assemble {
//     dependsOn shadowJar
// }

// Optional: Configure paperweight tasks if needed (usually defaults are fine)
// tasks.named("reobfJar") { ... }